<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETRO MNL DAILY SERVICE REVIEW</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent-blue: #2563eb;
      --accent-cyan: #06b6d4;
      --text-muted: #9ca3af;
      --text-main: #f9fafb;
      --tab-active: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Top Header */
    header {
      background: linear-gradient(180deg, #131d31 0%, #0b0f19 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .brand-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .brand-subtitle { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    /* Upload Hub */
    .file-hub {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #1e293b66;
      border: 1px dashed #374151;
      padding: 0.5rem 1rem;
      border-radius: 8px;
    }
    .file-hub label { font-size: 0.78rem; font-weight: 600; color: var(--accent-cyan); cursor: pointer; }
    .file-hub input[type="file"] { display: none; }
    .loaded-tag { font-size: 0.75rem; color: #10b981; font-weight: 500; }

    /* Navigation Bar */
    nav {
      background: #0f172a;
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid var(--card-border);
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { background: #1e293b; color: #fff; }
    .tab-btn.active {
      background: #1e293b;
      border-color: #3b82f6;
      color: #60a5fa;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
    }

    /* Content Area */
    main { flex: 1; position: relative; width: 100%; display: flex; }
    iframe#viewerFrame {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 140px);
      border: none;
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">PETRO MNL DAILY SERVICE REVIEW</div>
      <div class="brand-subtitle">Workforce Operations & Performance Telemetry</div>
    </div>
    <div class="file-hub">
      <label for="htmlUploader">📁 Batch Import Tab HTMLs</label>
      <input type="file" id="htmlUploader" multiple accept=".html,.htm">
      <span class="loaded-tag" id="statusMessage">Default Linked</span>
    </div>
  </header>

  <nav>
    <button class="tab-btn active" onclick="navigate('ABANDON', 'abandon.html')">📉 Abandon Review</button>
    <button class="tab-btn" onclick="navigate('TENURE', 'tenurity.html')">👥 Tenurity Stats</button>
    <button class="tab-btn" onclick="navigate('MONTHLY', 'monthly.html')">📅 Monthly Stats</button>
    <button class="tab-btn" onclick="navigate('UPDATES', 'updates.html')">📢 Updates & Outages</button>
  </nav>

  <main>
    <iframe id="viewerFrame" src="abandon.html" title="Active Section Viewer"></iframe>
  </main>

  <script>
    const fileStore = {};

    function navigate(tabName, defaultPath) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');

      const frame = document.getElementById('viewerFrame');
      // If a local uploaded file exists in memory for this tab, use its Object URL; otherwise use relative path
      if (fileStore[tabName.toLowerCase()]) {
        frame.src = fileStore[tabName.toLowerCase()];
      } else {
        frame.src = defaultPath;
      }
    }

    // Handles uploading single or all 4 HTML files at once
    document.getElementById('htmlUploader').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      files.forEach(f => {
        const url = URL.createObjectURL(f);
        const name = f.name.toLowerCase();
        if (name.includes('abandon')) fileStore['abandon'] = url;
        else if (name.includes('tenur')) fileStore['tenure'] = url;
        else if (name.includes('month')) fileStore['monthly'] = url;
        else if (name.includes('update')) fileStore['updates'] = url;
      });

      const currentActive = document.querySelector('.tab-btn.active').innerText;
      if (currentActive.includes('Abandon') && fileStore['abandon']) {
        document.getElementById('viewerFrame').src = fileStore['abandon'];
      }
      document.getElementById('statusMessage').innerText = `${files.length} custom file(s) active`;
    });
  </script>
</body>
</html>
