<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updates - PETRO MNL</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- SheetJS, Firebase SDKs -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border-subtle: #e2e8f0;
      --teal-dark: #0f766e;
      --teal-primary: #0d9488;
      --teal-subtle: #f0fdfa;
      --teal-border: #ccfbf1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body {
      height: 100vh;
      width: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: clamp(0.75rem, 1.5vh, 1.25rem) clamp(1rem, 1.5vw, 1.75rem);
      gap: 1rem;
    }

    .top-toolbar { display: none; }

    /* Secondary Header Row */
    .section-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0.25rem;
      margin-top: 0.25rem;
    }
    .section-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .section-badge {
      background: var(--teal-dark);
      color: #ffffff;
      padding: 0.35rem 1rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.05em;
    }
    .section-sub { font-size: 0.78rem; font-weight: 800; color: var(--text-muted); }
    
    .header-action-btn {
      background: var(--teal-dark);
      color: #ffffff;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(15, 118, 110, 0.25);
    }
    .header-action-btn:hover { background: var(--teal-primary); transform: translateY(-1px); }

    /* Main Container */
    .updates-main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 2rem;
    }

    /* Flexible Main Updates Board */
    .client-post-card {
      background: var(--card-bg);
      border: 2px solid var(--teal-dark);
      border-radius: 16px;
      padding: 2rem 2.5rem;
      box-shadow: var(--shadow-card);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Individual Update Item / Section */
    .update-item-block {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .update-item-block:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .update-content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .update-title {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--teal-dark);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    
    .section-actions {
      display: flex;
      gap: 0.35rem;
    }
    .action-icon-btn {
      background: #f8fafc;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      width: 28px; height: 28px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .action-icon-btn.edit:hover { background: #f0fdfa; color: var(--teal-dark); border-color: var(--teal-primary); }
    .action-icon-btn.delete:hover { background: #fef2f2; color: #ef4444; border-color: #fee2e2; }

    .update-body {
      font-size: 0.96rem;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .update-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.2rem;
    }
    .update-timestamp {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .update-image-container {
      width: 100%;
      max-width: 640px;
      max-height: 320px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: #f8fafc;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
    }
    .update-image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #0f172a05;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      width: min(94vw, 580px);
      padding: 1.5rem;
      box-shadow: 0 20px 35px -5px rgba(15, 23, 42, 0.15);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 0.6rem; border-bottom: 1px solid var(--border-subtle);
    }
    .modal-title { font-size: 1rem; font-weight: 900; color: var(--text-main); }
    .close-btn { background: none; border: none; font-size: 1.3rem; color: var(--text-muted); cursor: pointer; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .form-group label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .form-input, .form-textarea {
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-main);
      outline: none;
      background: #f8fafc;
      transition: all 0.2s ease;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--teal-primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1); }
    .form-textarea { resize: vertical; min-height: 110px; font-family: 'Plus Jakarta Sans', sans-serif; }

    .editor-toolbar {
      display: flex;
      gap: 0.35rem;
      background: #f1f5f9;
      padding: 0.35rem;
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border-subtle);
      border-bottom: none;
    }
    .format-btn {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.25rem 0.8rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .format-btn:hover { background: var(--teal-subtle); color: var(--teal-dark); border-color: var(--teal-primary); }
    .form-textarea.has-toolbar { border-top-left-radius: 0; border-top-right-radius: 0; }
    
    .file-upload-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .file-input-label {
      background: var(--teal-subtle);
      border: 1px dashed var(--teal-primary);
      color: var(--teal-primary);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.2s ease;
    }
    .file-input-label:hover { background: #ccfbf1; }
    input[type="file"] { display: none; }
    .file-name-display { font-size: 0.74rem; font-weight: 700; color: var(--text-muted); }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.75rem;
    }
    .btn-secondary {
      background: #f1f5f9;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.45rem 0.95rem;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #e2e8f0; color: var(--text-main); }
    .btn-primary {
      background: var(--teal-dark);
      color: #ffffff;
      border: none;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-primary:hover { background: var(--teal-primary); }
  </style>
</head>
<body>

  <!-- Secondary Header Row with Publish button -->
  <div class="section-header-bar">
    <div class="section-header-left">
      <div class="section-badge">UPDATES</div>
      <span class="section-sub" id="syncStatus">Operational Broadcast & Notices</span>
    </div>
    <button class="header-action-btn" onclick="openUpdateModal()">+ Post New Update</button>
  </div>

  <!-- Main Content Container -->
  <div class="updates-main-container">
    <div class="client-post-card">
      <div id="updatesListContainer" style="display: flex; flex-direction: column; gap: 1.5rem; width: 100%;">
        <!-- Dynamically rendered updates list will appear here -->
      </div>
    </div>
  </div>

  <!-- Modal for Creating/Editing Updates -->
  <div class="modal-overlay" id="updateModal" onclick="if(event.target === this) closeUpdateModal()">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modalTitleText">Post New Update</div>
        <button class="close-btn" onclick="closeUpdateModal()">&times;</button>
      </div>

      <input type="hidden" id="editUpdateId" value="">

      <div class="form-group">
        <label>Update Title / Category (e.g. Absences, System Alert)</label>
        <input type="text" id="updateTitleInput" class="form-input" placeholder="e.g. Absences / System Alert">
      </div>

      <div class="form-group">
        <label>Update Details / Message (Normal font weight)</label>
        <div class="editor-toolbar">
          <button type="button" class="format-btn" onclick="insertFormat('<b>', '</b>')" title="Bold"><b>B</b></button>
          <button type="button" class="format-btn" onclick="insertFormat('<i>', '</i>')" title="Italic"><i>I</i></button>
        </div>
        <textarea id="updateBodyInput" class="form-textarea has-toolbar" placeholder="Type message or status here..."></textarea>
      </div>

      <div class="form-group">
        <label>Attach Supporting Image (Optional)</label>
        <div class="file-upload-row">
          <label for="updateImageFile" class="file-input-label">
            <span>📷 Choose Image</span>
          </label>
          <span class="file-name-display" id="fileNameDisplay">No image selected</span>
          <input type="file" id="updateImageFile" accept="image/*" onchange="handleImageSelection(event)">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeUpdateModal()">Cancel</button>
        <button class="btn-primary" id="modalSubmitBtn" onclick="saveUpdatePost()">Publish Update</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Project Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCO5JOFPIw8YWouzGQ1hVnrar-h85rBUyA",
      authDomain: "dailyservicereview.firebaseapp.com",
      projectId: "dailyservicereview",
      storageBucket: "dailyservicereview.firebasestorage.app",
      messagingSenderId: "1004019130373",
      appId: "1:1004019130373:web:8082b16c7570f56fd1fc6c",
      measurementId: "G-4SMDMW96Q5"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let updatesList = JSON.parse(localStorage.getItem('PETRO_MNL_CLIENT_UPDATES_V20') || 'null') || [
      {
        id: 1,
        title: "ABSENCES",
        body: "Jan Neri – 2 days absent due to sickness.<br>Felisha Sy – 3 days absent due to illness.",
        image: "",
        timestamp: "September 10, 2026 - 05:20 PM"
      }
    ];

    let selectedImageDataUrl = "";

    // Save updates to Firebase Cloud Firestore + local cache
    function saveToCloud() {
      localStorage.setItem('PETRO_MNL_CLIENT_UPDATES_V20', JSON.stringify(updatesList));
      document.getElementById('syncStatus').innerText = 'Syncing to Cloud...';
      db.collection('petro_updates').doc('notices_data').set({
        updatesList: updatesList,
        updatedAt: new Date()
      }).then(() => {
        console.log("Updates synced to Firebase.");
        document.getElementById('syncStatus').innerText = 'Operational Broadcast & Notices (Cloud Synced)';
      }).catch(err => {
        console.error("Firebase sync error:", err);
        document.getElementById('syncStatus').innerText = 'Cloud Sync Failed';
      });
    }

    // Load updates from Firebase Cloud Firestore + local cache fallback
    function loadFromCloud() {
      document.getElementById('syncStatus').innerText = 'Connecting to Cloud...';
      db.collection('petro_updates').doc('notices_data').get().then(doc => {
        if (doc.exists) {
          const remote = doc.data();
          if (remote.updatesList && Array.isArray(remote.updatesList)) {
            updatesList = remote.updatesList;
            localStorage.setItem('PETRO_MNL_CLIENT_UPDATES_V20', JSON.stringify(updatesList));
          }
          document.getElementById('syncStatus').innerText = 'Operational Broadcast & Notices (Cloud Synced)';
          renderUpdatesDashboard();
        } else {
          document.getElementById('syncStatus').innerText = 'Operational Broadcast & Notices';
          renderUpdatesDashboard();
        }
      }).catch(err => {
        console.log("Cloud fetch note:", err);
        document.getElementById('syncStatus').innerText = 'Operational Broadcast & Notices';
        renderUpdatesDashboard();
      });
    }

    function insertFormat(tagOpen, tagClose) {
      const textarea = document.getElementById('updateBodyInput');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const val = textarea.value;
      const selectedText = val.substring(start, end);
      
      textarea.focus();
      const replacement = tagOpen + selectedText + tagClose;
      
      if (typeof textarea.setRangeText === 'function') {
        textarea.setRangeText(replacement, start, end, 'select');
      } else {
        textarea.value = val.substring(0, start) + replacement + val.substring(end);
      }
    }

    function openUpdateModal(id = null) {
      document.getElementById('editUpdateId').value = '';
      document.getElementById('updateTitleInput').value = '';
      document.getElementById('updateBodyInput').value = '';
      document.getElementById('fileNameDisplay').innerText = 'No image selected';
      selectedImageDataUrl = '';

      if (id !== null) {
        const item = updatesList.find(u => u.id === id);
        if (item) {
          document.getElementById('modalTitleText').innerText = 'Edit Update Section';
          document.getElementById('modalSubmitBtn').innerText = 'Save Changes';
          document.getElementById('editUpdateId').value = item.id;
          document.getElementById('updateTitleInput').value = item.title;
          document.getElementById('updateBodyInput').value = item.body;
          selectedImageDataUrl = item.image || '';
          if (item.image) {
            document.getElementById('fileNameDisplay').innerText = 'Existing image attached';
          }
        }
      } else {
        document.getElementById('modalTitleText').innerText = 'Post New Update';
        document.getElementById('modalSubmitBtn').innerText = 'Publish Update';
      }

      document.getElementById('updateModal').style.display = 'flex';
    }

    function closeUpdateModal() {
      document.getElementById('updateModal').style.display = 'none';
    }

    function handleImageSelection(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('fileNameDisplay').innerText = file.name;
      const reader = new FileReader();
      reader.onload = function(evt) {
        selectedImageDataUrl = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveUpdatePost() {
      const editId = document.getElementById('editUpdateId').value;
      const title = document.getElementById('updateTitleInput').value.trim();
      const body = document.getElementById('updateBodyInput').value.trim();

      if (!title || !body) {
        alert("Please provide both a title and message body for the update.");
        return;
      }

      const now = new Date();
      const timestamp = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) + ' - ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

      if (editId) {
        const item = updatesList.find(u => u.id == editId);
        if (item) {
          item.title = title;
          item.body = body;
          item.image = selectedImageDataUrl;
          item.timestamp = timestamp + ' (Edited)';
        }
      } else {
        const newPost = {
          id: Date.now(),
          title,
          body,
          image: selectedImageDataUrl,
          timestamp
        };
        updatesList.unshift(newPost);
      }

      saveToCloud();
      closeUpdateModal();
      renderUpdatesDashboard();
    }

    function deleteUpdate(id) {
      if (confirm("Delete this update section?")) {
        updatesList = updatesList.filter(u => u.id !== id);
        saveToCloud();
        renderUpdatesDashboard();
      }
    }

    function renderUpdatesDashboard() {
      const container = document.getElementById('updatesListContainer');
      container.innerHTML = '';

      if (updatesList.length === 0) {
        container.innerHTML = `<div style="color: var(--text-muted); font-weight: 700; text-align: center; padding: 2rem;">No active updates posted. Click "+ Post New Update" above to add a new update section.</div>`;
        return;
      }

      updatesList.forEach(u => {
        const block = document.createElement('div');
        block.className = 'update-item-block';

        let formattedBody = u.body;
        if (!formattedBody.includes('<br>') && !formattedBody.includes('<b>') && !formattedBody.includes('<i>')) {
          formattedBody = formattedBody.replace(/\n/g, '<br>');
        }

        block.innerHTML = `
          <div class="update-content-header">
            <div class="update-title">${u.title}:</div>
            <div class="section-actions">
              <button class="action-icon-btn edit" onclick="openUpdateModal(${u.id})" title="Edit section">✏️</button>
              <button class="action-icon-btn delete" onclick="deleteUpdate(${u.id})" title="Delete section">🗑️</button>
            </div>
          </div>
          <div class="update-body">${formattedBody}</div>
          <div class="update-meta-row">
            <span class="update-timestamp">Broadcasted: ${u.timestamp}</span>
          </div>
          ${u.image ? `
            <div class="update-image-container">
              <img src="${u.image}" alt="Update attachment">
            </div>
          ` : ''}
        `;
        container.appendChild(block);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      // 1. Instant local cache load
      const cachedUpdates = JSON.parse(localStorage.getItem('PETRO_MNL_CLIENT_UPDATES_V20') || 'null');
      if (cachedUpdates && Array.isArray(cachedUpdates)) {
        updatesList = cachedUpdates;
      }
      renderUpdatesDashboard();

      // 2. Background cloud sync
      loadFromCloud();
    });
  </script>
</body>
</html>
